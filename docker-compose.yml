services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ewelink
      POSTGRES_PASSWORD: ewelink
      POSTGRES_DB: ewelink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewelink -d ewelink"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
