<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eWeLink devices</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; }
  nav a { margin-right: 1rem; }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 1.5rem; }
  .layout { display: flex; gap: 24px; align-items: flex-start; }
  #list { list-style: none; margin: 0; padding: 0; width: 240px; flex: none; border: 1px solid #ccc; border-radius: 6px; }
  #list li { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #eee; }
  #list li:last-child { border-bottom: 0; }
  #list li:hover { background: #f3f3f3; }
  #list li.selected { background: #e3edff; font-weight: 600; }
  #list small { display: block; color: #666; font-weight: normal; }
  #detail { flex: 1; min-width: 0; }
  table { border-collapse: collapse; }
  td, th { text-align: left; padding: 4px 16px 4px 0; }
  pre { background: #f6f6f6; padding: 12px; border-radius: 6px; overflow: auto; font-size: 0.85rem; }
  .muted { color: #666; }
  #error { color: #b00020; }
  @media (max-width: 640px) { .layout { flex-direction: column; } #list { width: 100%; } }
</style>
</head>
<body>
<nav><a href="/">History</a><a href="/devices">Devices</a></nav>
<header>
  <h1>Devices</h1>
  <button id="refresh" type="button">Refresh from eWeLink</button>
</header>
<p id="error"></p>
<div class="layout">
  <ul id="list"></ul>
  <div id="detail"><p class="muted">Select a device.</p></div>
</div>

<script>
const UNITS = { temperature: '°C', humidity: '%' };
const list = document.getElementById('list');
const detail = document.getElementById('detail');
const error = document.getElementById('error');

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function row(label, value) {
  const tr = document.createElement('tr');
  tr.append(el('th', label), el('td', value));
  return tr;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function markSelected(id) {
  for (const li of list.children) li.classList.toggle('selected', li.dataset.id === id);
}

async function showDevice(id) {
  selectedId = id;
  markSelected(id);
  let d;
  try {
    d = await fetchJSON('/api/devices/' + encodeURIComponent(id));
    error.textContent = '';
  } catch (e) {
    error.textContent = 'Failed to load device: ' + e.message.trim();
    return;
  }

  const info = el('table');
  info.append(
    row('Device ID', d.id),
    row('Model', d.productModel || '—'),
    row('Details refreshed', new Date(d.refreshedAt).toLocaleString()),
  );

  const readings = el('table');
  for (const r of d.readings) {
    const unit = UNITS[r.kind] || '';
    readings.append(row(r.kind, `${r.v.toFixed(1)}${unit}  ·  ${new Date(r.t).toLocaleString()}`));
  }

  detail.replaceChildren(
    el('h2', d.name),
    info,
    el('h2', 'Latest readings'),
    d.readings.length ? readings : el('p', 'No readings recorded.', 'muted'),
    el('h2', 'Details'),
    el('pre', JSON.stringify(d.details, null, 2)),
  );
}

function select(id) {
  location.hash = id;
}

let selectedId = null;

async function loadList() {
  const devices = await fetchJSON('/api/devices');
  list.replaceChildren();
  for (const d of devices) {
    const li = el('li', d.name);
    li.dataset.id = d.id;
    li.append(el('small', d.productModel || d.id));
    li.addEventListener('click', () => select(d.id));
    list.append(li);
  }
  markSelected(selectedId);
  return devices;
}

async function refresh() {
  const button = document.getElementById('refresh');
  button.disabled = true;
  button.textContent = 'Refreshing…';
  try {
    const res = await fetch('/api/devices/refresh', { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    await loadList();
    if (selectedId) await showDevice(selectedId);
    error.textContent = '';
  } catch (e) {
    error.textContent = 'Refresh failed: ' + e.message.trim();
  } finally {
    button.disabled = false;
    button.textContent = 'Refresh from eWeLink';
  }
}

async function init() {
  let devices;
  try {
    devices = await loadList();
  } catch (e) {
    error.textContent = 'Failed to load devices: ' + e.message.trim();
    return;
  }
  document.getElementById('refresh').addEventListener('click', refresh);
  const fromHash = () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id) showDevice(id);
  };
  window.addEventListener('hashchange', fromHash);
  if (location.hash) fromHash();
  else if (devices.length) select(devices[0].id);
}

init();
</script>
</body>
</html>
