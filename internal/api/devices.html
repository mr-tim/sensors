<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devices</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5"></script>
</head>
<body class="mx-auto max-w-4xl p-4 font-sans">
<nav class="space-x-4"><a class="text-blue-700 hover:underline" href="/">History</a><a class="text-blue-700 hover:underline" href="/devices">Devices</a></nav>
<header class="flex items-center justify-between">
  <h1 class="text-2xl font-semibold">Devices</h1>
  <button id="refresh" type="button" class="rounded border border-gray-300 px-3 py-1 hover:bg-gray-100 disabled:opacity-50">Refresh from eWeLink</button>
</header>
<p id="error" class="text-red-700"></p>
<div class="flex flex-col items-start gap-6 sm:flex-row">
  <ul id="list" class="m-0 w-full flex-none list-none rounded-md border border-gray-300 p-0 sm:w-60"></ul>
  <div id="detail" class="w-full min-w-0 flex-1"><p class="text-gray-600">Select a device.</p></div>
</div>

<script>
const H2 = 'mt-6 mb-2 text-lg font-semibold';
const UNITS = { temperature: '°C', humidity: '%' };
const list = document.getElementById('list');
const detail = document.getElementById('detail');
const error = document.getElementById('error');

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function row(label, value) {
  const tr = document.createElement('tr');
  tr.append(el('th', label, 'py-1 pr-4 text-left'), el('td', value, 'py-1 pr-4 text-left'));
  return tr;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function markSelected(id) {
  for (const li of list.children) li.toggleAttribute('data-selected', li.dataset.id === id);
}

async function showDevice(id) {
  selectedId = id;
  markSelected(id);
  let d;
  try {
    d = await fetchJSON('/api/devices/' + encodeURIComponent(id));
    error.textContent = '';
  } catch (e) {
    error.textContent = 'Failed to load device: ' + e.message.trim();
    return;
  }

  const info = el('table');
  info.append(
    row('Device ID', d.id),
    row('Model', d.productModel || '—'),
    row('Details refreshed', new Date(d.refreshedAt).toLocaleString()),
  );

  const readings = el('table');
  for (const r of d.readings) {
    const unit = UNITS[r.kind] || '';
    readings.append(row(r.kind, `${r.v.toFixed(1)}${unit}  ·  ${new Date(r.t).toLocaleString()}`));
  }

  detail.replaceChildren(
    el('h2', d.name, H2),
    info,
    el('h2', 'Latest readings', H2),
    d.readings.length ? readings : el('p', 'No readings recorded.', 'text-gray-600'),
    el('h2', 'Details', H2),
    el('pre', JSON.stringify(d.details, null, 2), 'overflow-auto rounded-md bg-gray-100 p-3 text-sm'),
  );
}

function select(id) {
  location.hash = id;
}

let selectedId = null;

async function loadList() {
  const devices = await fetchJSON('/api/devices');
  list.replaceChildren();
  for (const d of devices) {
    const li = el('li', d.name, 'cursor-pointer border-b border-gray-200 px-3 py-2 last:border-b-0 hover:bg-gray-100 data-selected:bg-blue-100 data-selected:font-semibold');
    li.dataset.id = d.id;
    li.append(el('small', d.productModel || d.id, 'block font-normal text-gray-600'));
    li.addEventListener('click', () => select(d.id));
    list.append(li);
  }
  markSelected(selectedId);
  return devices;
}

async function refresh() {
  const button = document.getElementById('refresh');
  button.disabled = true;
  button.textContent = 'Refreshing…';
  try {
    const res = await fetch('/api/devices/refresh', { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    await loadList();
    if (selectedId) await showDevice(selectedId);
    error.textContent = '';
  } catch (e) {
    error.textContent = 'Refresh failed: ' + e.message.trim();
  } finally {
    button.disabled = false;
    button.textContent = 'Refresh from eWeLink';
  }
}

async function init() {
  let devices;
  try {
    devices = await loadList();
  } catch (e) {
    error.textContent = 'Failed to load devices: ' + e.message.trim();
    return;
  }
  document.getElementById('refresh').addEventListener('click', refresh);
  const fromHash = () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id) showDevice(id);
  };
  window.addEventListener('hashchange', fromHash);
  if (location.hash) fromHash();
  else if (devices.length) select(devices[0].id);
}

init();
</script>
</body>
</html>
